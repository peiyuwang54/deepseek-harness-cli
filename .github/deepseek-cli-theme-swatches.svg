<svg xmlns="http://www.w3.org/2000/svg" width="392" height="88" viewBox="0 0 392 88" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek CLI theme colors</title>
  <desc id="desc">Inset swatches for DeepSeek, Cosmic Orange, Mist Blue, Sage, Lavender, and Deep Blue.</desc>
  <defs>
    <linearGradient id="inset" x1="0.12" y1="0.04" x2="0.78" y2="0.86">
      <stop offset="0" stop-color="#1b1d22" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#1b1d22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1=".86" y1=".94" x2=".28" y2=".18">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="58%" r="64%" fx="36%" fy="30%">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
