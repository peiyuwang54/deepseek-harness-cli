    <circle r="18" fill="url(#rim)"/>
    <circle r="18" fill="url(#inset)"/>
    <circle r="18" fill="url(#shine)"/>
  </g>
  <g transform="translate(280 44)">
    <circle r="18" fill="#e6d5f1"/>
    <circle r="18" fill="url(#rim)"/>
