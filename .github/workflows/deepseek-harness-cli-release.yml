# Build and distribute the deepseek-harness-cli single-file executable across three
# channels: GitHub Releases (curl|sh and install.ps1), npm (@peiyu_wang/deepseek-harness-cli), and a
# Homebrew cask pushed to peiyuwang54/homebrew-dsh. Runs on every deepseek-harness-cli-v*
# tag push or from a manual dispatch; a manual dispatch is also the only way to
# release without pushing a tag first. The build/package/release jobs are
# keyless; npm-publish requires the npm-publish environment and brew-tap the
# HOMEBREW_TAP_TOKEN secret.
name: Release deepseek-harness-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0-rc.5 (default: apps/cli/package.json)'
        required: false
        type: string
  push:
    tags:
      - 'deepseek-harness-cli-v*'

permissions:
  contents: read

concurrency:
  # A release must not cancel its own rerun on the same ref.
  group: deepseek-harness-cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#deepseek-harness-cli-v}"
          else
            version="$(node -p "require('./apps/cli/package.json').version")"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute the five-target matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix='[]'
          while IFS= read -r entry; do
            t="${entry%% *}"
            runner="${entry#* }"
            matrix="$(jq -c --arg target "$t" --arg runner "$runner" '. + [{target: $target, runner: $runner}]' <<< "$matrix")"
          done <<'EOF'
          node24-linux-x64 ubuntu-latest
          node24-linux-arm64 ubuntu-24.04-arm
          node24-macos-arm64 macos-15
          node24-macos-x64 macos-15-intel
          node24-win-x64 windows-2025
          EOF
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Cache pkg's target Node binary; lockfile changes roll the exact key.
      - uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-deepseek-harness-cli-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-fetch-deepseek-harness-cli-${{ matrix.target }}-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Rebuild Linux node-pty against manylinux 2.28
        if: runner.os == 'Linux'
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::Unsupported Linux runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)"
          addon="$addon_dir/build/Release/pty.node"
          node_bin_dir="$(dirname "$(command -v node)")"
          pnpm_bin_dir="$(dirname "$(command -v pnpm)")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e "HOME=$HOME" \
            -e "DSH_NODE_BIN_DIR=$node_bin_dir" \
            -e "DSH_PNPM_BIN_DIR=$pnpm_bin_dir" \
            -e "PNPM_HOME=$PNPM_HOME" \
            -e npm_config_build_from_source=true \
            -e npm_config_python=/opt/python/cp310-cp310/bin/python \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/node-gyp:$HOME/.cache/node-gyp" \
            -v "$RUNNER_TEMP/setup-pnpm:$RUNNER_TEMP/setup-pnpm" \
            -v "$RUNNER_TOOL_CACHE:$RUNNER_TOOL_CACHE:ro" \
            -w "$PWD" \
            "$image" \
            bash -euxo pipefail -c \
              'export PATH="$DSH_NODE_BIN_DIR:$DSH_PNPM_BIN_DIR:$PATH"
              pnpm --filter @deepseek-ai/dsh-subprocess-local rebuild node-pty'
          [ -f "$addon" ] || { echo "::error::$addon missing after manylinux rebuild"; exit 1; }

      - name: Build single-exe
        run: pnpm exec tsx scripts/build-dsh-cli-exe.ts --targets=${{ matrix.target }}

      - name: Resolve product paths
        id: product
        run: |
          set -euo pipefail
          platform="${TARGET#node24-}"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}

      - name: Smoke test --version
        run: |
          set -euo pipefail
          exe="$PWD/dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}"
          if [ ! -e "$exe" ] && [ -e "$exe.exe" ]; then exe="$exe.exe"; fi
          [ -x "$exe" ] || { echo "::error::$exe missing or not executable"; exit 1; }
          actual="$(DSH_TELEMETRY_DISABLED=1 "$exe" --version)"
          [ "$actual" = "$VERSION" ] || {
            echo "::error::$exe reports '$actual' but the release version is '$VERSION'"
            exit 1
          }

      - name: Smoke test profile composition
        run: |
          set -euo pipefail
          exe="$PWD/dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}"
          if [ ! -e "$exe" ] && [ -e "$exe.exe" ]; then exe="$exe.exe"; fi
          # --version exits before any profile composes; the dumps read every
          # bundle overlay the executable embeds, so a missing pkg asset fails
          # here instead of on the user's first run.
          for profile in tui web; do
            DSH_TELEMETRY_DISABLED=1 "$exe" "$profile" --dump-default-config > /dev/null
          done

      - name: Smoke test packaged Web startup
        run: |
          set -euo pipefail
          exe="$PWD/dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}"
          if [ ! -e "$exe" ] && [ -e "$exe.exe" ]; then exe="$exe.exe"; fi
          smoke_home="$RUNNER_TEMP/dsh-web-smoke"
          smoke_log="$RUNNER_TEMP/dsh-web-smoke.log"
          mkdir -p "$smoke_home"
          DSH_HOME="$smoke_home" DSH_TELEMETRY_DISABLED=1 \
            "$exe" web --host 127.0.0.1 --port 39460 >"$smoke_log" 2>&1 &
          smoke_pid=$!
          cleanup() {
            if [ "$RUNNER_OS" = Windows ]; then
              taskkill //PID "$smoke_pid" //T //F > /dev/null 2>&1 || true
            else
              kill "$smoke_pid" > /dev/null 2>&1 || true
            fi
            wait "$smoke_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 150); do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              cat "$smoke_log"
              echo "::error::packaged Web profile exited before it became ready"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:39460/ | grep -q '<title>DeepSeek Harness</title>'; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            cat "$smoke_log"
            echo "::error::packaged Web profile did not become ready"
            exit 1
          fi
          sleep 2
          kill -0 "$smoke_pid" 2>/dev/null || {
            cat "$smoke_log"
            echo "::error::packaged Web profile exited after its first response"
            exit 1
          }
          curl -fsS http://127.0.0.1:39460/ | grep -q '<title>DeepSeek Harness</title>'

      - name: Check Linux GLIBC requirements
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          exe="$PWD/dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}"
          readelf --version-info "$exe" | tee glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' glibc-versions.txt | sort -V | tail -1)"
          [ -n "$maximum" ] || { echo "::error::No GLIBC requirements found"; exit 1; }
          dpkg --compare-versions "$maximum" le 2.28 || {
            echo "::error::Executable requires GLIBC_$maximum but the release claims manylinux 2.28"
            exit 1
          }

      - name: Check macOS deployment target
        if: runner.os == 'macOS'
        env:
          EXE: ${{ github.workspace }}/dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}
        run: python3 scripts/check-macos-deployment-target.py "$EXE" "$EXE-spawn-helper"

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-cli-exe-${{ steps.product.outputs.platform }}
          path: |
            dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}
            dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}.exe
            dist-exe/deepseek-harness-cli-${{ steps.product.outputs.platform }}-spawn-helper
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [plan, build]
    name: package release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all target executables
        uses: actions/download-artifact@v4
        with:
          path: dist-exe
          merge-multiple: true

      - name: Build release tarballs and sha256 sidecars
        run: |
          set -euo pipefail
          mkdir -p dist-release
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64 win-x64; do
            os="${target%-*}"
            cpu="${target#*-}"
            exe="dist-exe/deepseek-harness-cli-$target"
            dest_name=deepseek-harness-cli
            if [ ! -e "$exe" ] && [ -e "$exe.exe" ]; then exe="$exe.exe"; dest_name=deepseek-harness-cli.exe; fi
            stage="$RUNNER_TEMP/stage-$target"
            mkdir -p "$stage/bin"
            cp "$exe" "$stage/bin/$dest_name"
            chmod +x "$stage/bin/$dest_name"
            if [ "$os" = macos ]; then
              cp "dist-exe/deepseek-harness-cli-$target-spawn-helper" "$stage/bin/deepseek-harness-cli-spawn-helper"
              chmod +x "$stage/bin/deepseek-harness-cli-spawn-helper"
            fi
            (cd "$stage" && tar -czf "$GITHUB_WORKSPACE/dist-release/deepseek-harness-cli-${cpu}-${os}.tar.gz" bin)
            (cd dist-release && sha256sum "deepseek-harness-cli-${cpu}-${os}.tar.gz" > "deepseek-harness-cli-${cpu}-${os}.sha256")
          done

      - name: Lay out npm packages
        run: pnpm exec tsx scripts/package-dsh-cli-npm.ts --version "$VERSION" --dir dist-exe --out dist-npm

      - name: Generate Homebrew cask
        run: pnpm exec tsx scripts/gen-dsh-cask.ts --version "$VERSION" --dir dist-release --out deepseek-harness-cli.rb

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-cli-release-assets
          path: dist-release
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-cli-npm-packages
          path: dist-npm
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-cli-cask
          path: deepseek-harness-cli.rb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [plan, package]
    name: create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-cli-release-assets
          path: dist-release

      - name: Create or refresh the release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="deepseek-harness-cli-v$VERSION"
          if [[ "$VERSION" == *-* ]]; then release_kind=(--prerelease); else release_kind=(--prerelease=false); fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" "${release_kind[@]}" --repo "$GITHUB_REPOSITORY"
            gh release upload "$tag" dist-release/*.tar.gz dist-release/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist-release/*.tar.gz dist-release/*.sha256 --title "$tag" --generate-notes "${release_kind[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  npm-publish:
    needs: [plan, package]
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers and the allowed tags live on this environment; it is
    # the only job that can write to the registry.
    environment: npm-publish
    # Shared with release.yml's npm-publish job: stable/prerelease dist-tags
    # are shared registry state, so the two publishers serialize rather than
    # race. cancel-in-progress: false queues, never cancels.
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm publisher identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-cli-npm-packages
          path: dist-npm

      - name: Publish the main shim and per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then main_tag=next; else main_tag=latest; fi
          test -f dist-npm/main/package.json
          npm publish "./dist-npm/main" --tag "$main_tag"
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64 win-x64; do
            test -f "dist-npm/platform/${VERSION}-${target}/package.json"
            npm publish "./dist-npm/platform/${VERSION}-${target}" --tag "$target"
          done

  brew-tap:
    needs: [plan, release]
    name: push cask to homebrew-dsh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-cli-cask
          path: cask-artifact

      - name: Push the cask to peiyuwang54/homebrew-dsh
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/peiyuwang54/homebrew-dsh.git" tap
          mkdir -p tap/Casks/d
          cp cask-artifact/deepseek-harness-cli.rb tap/Casks/d/deepseek-harness-cli.rb
          git -C tap config user.name "deepseek-harness-cli-release[bot]"
          git -C tap config user.email "noreply@github.com"
          git -C tap add Casks/d/deepseek-harness-cli.rb
          if git -C tap diff --cached --quiet; then
            echo "Casks/d/deepseek-harness-cli.rb is unchanged; nothing to push."
          else
            git -C tap -c commit.gpgsign=false commit -m "deepseek-harness-cli v${VERSION}"
            git -C tap push
          fi
