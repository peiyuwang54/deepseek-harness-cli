# The line-oriented terminal CLI over dsh-base. It mounts no HTTP or browser
# host: startup parses the app argv, then the runner creates or resumes through
# the existing Agent registry and consumes the durable Session event stream.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# Module reload remains off; the launcher's watch-only fallback still keeps
# personal and profile patch layers live during a long interactive Session.
- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: terminal-cli-startup
      name: '@deepseek-ai/dsh-terminal-cli/startup'

    - id: terminal-cli-runner
      name: '@deepseek-ai/dsh-terminal-cli'
      inject: [terminalCliStartup]
